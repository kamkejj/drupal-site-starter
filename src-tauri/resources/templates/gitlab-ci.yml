# Runs composer lint and analyse plus the unit tests in a plain PHP image.
# Kernel and functional tests need DDEV's database and web server, so run
# them locally with `ddev composer test`. Generated by Drupal DDEV Site Creator.
image: php:{{PHP}}-cli

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"

cache:
  key: composer
  paths:
    - vendor/

before_script:
  - apt-get update -qq && apt-get install -y -qq git unzip > /dev/null
  - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
  - chmod +x /usr/local/bin/install-php-extensions
  - install-php-extensions gd zip pdo_mysql pdo_pgsql @composer
  - composer install -n --no-progress

lint:
  script:
    - composer lint

analyse:
  script:
    - composer analyse

test:
  script:
    - vendor/bin/phpunit --testsuite unit
