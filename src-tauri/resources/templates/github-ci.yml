# Runs the project's checks in DDEV, the same way as on your machine:
# ddev composer lint, analyse and test. Generated by Drupal Site Starter.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ddev/github-action-setup-ddev@v1
      - run: ddev composer install -n
      - run: ddev composer lint
      - run: ddev composer analyse
      - run: ddev composer test
