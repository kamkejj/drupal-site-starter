# Publishes the compat.json on main as a data update, without a new
# app release: signs it with the updater key and replaces compat.json and
# compat.json.sig on the latest published release. Apps whose Update URL is
# https://github.com/kamkejj/drupal-site-starter/releases/latest/download
# pick it up on their next check. Bump `revision` in
# src-tauri/resources/compat.json first; this refuses a revision that isn't
# higher than the one already published.
#
# Like release.yml, this job holds the signing key, so every action is
# pinned to a commit.
name: Publish compat.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # Only reviewed data goes out to users.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the revision is newer than the published one
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --json tagName -q .tagName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          published=0
          if gh release download "$tag" -p compat.json -O "$RUNNER_TEMP/published.json"; then
            published="$(jq -r .revision "$RUNNER_TEMP/published.json")"
          fi
          revision="$(jq -r .revision src-tauri/resources/compat.json)"
          echo "Publishing revision $revision to $tag (published: $published)."
          if [ "$revision" -le "$published" ]; then
            echo "::error::Bump revision in src-tauri/resources/compat.json above $published first."
            exit 1
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sign:compat
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Replace compat.json on the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag }}" dist/compat/compat.json dist/compat/compat.json.sig --clobber
